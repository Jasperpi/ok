# Publishes the install wizard in site/ to GitHub Pages, with the Gallant
# font and the icon made from ok's own bitmaps, and the Linux install script.
name: site

on:
  push:
    branches: [main]
    paths: ["site/**", "crates/ok-link/**", "crates/ok-gfx/**", "packaging/linux/install.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: |
          cargo run -q -p ok-link --example relay-assets -- made
          mkdir -p _site
          cp site/index.html _site/
          cp made/gallant.ttf made/icon.png _site/
          cp packaging/linux/install.sh _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
